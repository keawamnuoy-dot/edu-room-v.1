databases:
  - name: eduroom-db
    plan: free
    databaseName: eduroom
    user: eduroom

services:
  - type: web
    name: edu-room-v-1
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduroom-db
          property: connectionString
      - key: APP_ENV
        value: production
